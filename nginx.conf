server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation: lets the WASM backend use multiple threads (SharedArrayBuffer).
    # Everything the page loads is same-origin, so require-corp does not block anything.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # The JS bundle is ~2.5 MB uncompressed; compress the text-like files.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/wasm;
}
